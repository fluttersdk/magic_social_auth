# magic_social_auth install manifest (PluginInstaller DSL schema v1).
#
# SocialAuth is a Magic-side plugin: install registers
# SocialAuthArtisanProvider into the consumer's lib/app/_plugins.g.dart
# codegen barrel AND injects SocialAuthServiceProvider into
# lib/config/app.dart's providers list so the Magic IoC container resolves
# the runtime SocialAuth facade.
#
# Everything else depends on the flags of `social:install` and on what the
# project holds, so the command stages it on top of this manifest (see
# SocialInstallCommand): lib/config/social_auth.dart and its config factory, the
# iOS Google keys, URL scheme and Sign in with Apple entitlement, the Android
# callback activity, web/auth.html, and the magic_starter bridge when the app
# lists magic_starter.
#
# See doc/install_yaml_schema.md (in fluttersdk_artisan) for the full schema.

plugin_name: magic_social_auth

publish: {}

magic:
  provider: SocialAuthServiceProvider

post_install:
  message: |
    magic_social_auth installed. Next:

    1. Fill in lib/config/social_auth.dart wherever a value is still empty
       (the Google client ids, the iOS and Android callbacks). Re-running
       social:install with the flags writes them for you.

    2. Check the native setup and print the values the backend needs:

         dart run <app>:artisan social:doctor

    3. Set those values in the magic-starter-laravel .env, and register
       https://<api host>/magic-starter/social/{provider}/callback in each
       provider console.
